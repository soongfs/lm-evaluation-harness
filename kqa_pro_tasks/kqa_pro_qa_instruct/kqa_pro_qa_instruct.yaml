task: kqa_pro_qa_instruct
custom_dataset: !function utils.load_local_dataset
training_split: train
validation_split: validation
fewshot_split: train
fewshot_config:
  sampler: first_n

output_type: generate_until
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{answer}}"

generation_kwargs:
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0

filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true

metadata:
  version: 0.1
