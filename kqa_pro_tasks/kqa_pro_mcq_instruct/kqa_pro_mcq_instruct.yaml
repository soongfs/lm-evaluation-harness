task: kqa_pro_mcq_instruct
custom_dataset: !function utils.load_local_dataset
training_split: train
validation_split: validation
fewshot_split: train

output_type: generate_until
process_docs: !function utils.process_docs
doc_to_text: "Given the following question and ten candidate answers (A-J), choose the best answer.\nQuestion: {{question}}\n{{options_block}}\nYour response should end with \"The best answer is [the_answer_letter]\" where [the_answer_letter] is one of A, B, C, D, E, F, G, H, I, or J."
gen_prefix: "The best answer is"
doc_to_target: gold_letter_with_period

fewshot_config:
  sampler: first_n

generation_kwargs:
  do_sample: false
  until:
    - "."
  max_gen_toks: 10

filter_list:
  - name: strict_match
    filter:
      - function: remove_whitespace
      - function: take_first

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
    regexes_to_ignore:
      - "\\$"
      - "\\.$"

metadata:
  version: 0.3
