task: kqa_pro_mcq_instruct
custom_dataset: !function utils.load_local_dataset
training_split: train
validation_split: validation
fewshot_split: train

output_type: generate_until
process_docs: !function utils.process_docs
doc_to_text: "Given the following question and ten candidate answers (A-J), choose the best answer.\n\nQuestion: {{question}}\n{{options_block}}\n\nFor simple problems, directly provide the answer with minimal explanation.\nFor complex problems, briefly reason step by step.\nRegardless of the approach, always conclude with:\nThe best answer is X.\nwhere X is one of A, B, C, D, E, F, G, H, I, or J."
doc_to_target: gold_letter

fewshot_config:
  sampler: first_n
  doc_to_target: answer_sentence

generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 256
  until: []

filter_list:
  - name: extract_letter
    filter:
      - function: regex
        regex_pattern: "(?i)best answer is\\s*([A-J])"
        group_select: -1
      - function: take_first

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true

metadata:
  version: 0.2
