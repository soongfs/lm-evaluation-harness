task: kqa_pro_qa_contains_instruct
custom_dataset: !function utils.load_local_dataset
training_split: train
validation_split: validation
fewshot_split: train
fewshot_config:
  sampler: first_n

output_type: generate_until
doc_to_text: "Question: {{question}}\nPlease answer the question. You may explain briefly, but make sure the answer text is explicitly included in your response.\nAnswer:"
doc_to_target: "{{answer}}"

generation_kwargs:
  until:
    - "\n\n"
    - "\nQuestion:"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128

filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first

metric_list:
  - metric: !function utils.contains_answer
    aggregation: mean
    higher_is_better: true

metadata:
  version: 0.1
