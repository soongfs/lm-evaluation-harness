task: kqa_pro_mcq
custom_dataset: !function utils.load_local_dataset
training_split: train
validation_split: validation
fewshot_split: train

output_type: multiple_choice
process_docs: !function utils.process_docs
doc_to_text: "Question: {{question}}\n{{options_block}}\nAnswer:"
doc_to_choice: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"]
doc_to_target: gold_letter

fewshot_config:
  sampler: first_n

metric_list:
  - metric: acc
  - metric: acc_norm

metadata:
  version: 0.2
